<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXHOME AI Ultimate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #161b2c;
            --accent: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --ai-bubble: #1e293b;
            --nav-bg: #111827;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Audio Init Overlay */
        #audio-init {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg); z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }

        .content-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 160px; scroll-behavior: smooth; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px;
            background: var(--nav-bg); border-top: 1px solid var(--glass);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); cursor: pointer; background: none; border: none; font-size: 0.75rem; gap: 4px;
        }
        .nav-item.active { color: var(--accent); }

        /* AI Chat */
        .chat-container { display: flex; flex-direction: column; gap: 12px; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 0.9rem; line-height: 1.5; }
        .ai-bubble { background: var(--ai-bubble); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--glass); }
        .user-bubble { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }

        .chat-input-container {
            position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 500px;
            display: flex; gap: 10px; align-items: center; z-index: 1001;
        }
        .chat-input {
            flex: 1; background: var(--card); border: 1px solid var(--glass);
            border-radius: 30px; padding: 12px 20px; color: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        /* Device Grid */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .device-card {
            background: var(--card); border-radius: 20px; padding: 15px;
            border: 1px solid var(--glass); position: relative;
        }
        .device-card.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.08); }
        .device-name { font-weight: 600; font-size: 0.85rem; display: block; margin: 5px 0; }
        .sched-tag { font-size: 0.6rem; color: var(--accent); background: rgba(56,189,248,0.1); padding: 2px 6px; border-radius: 4px; margin-top: 5px; display: inline-block; }

        /* Modal */
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); z-index: 2000; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-card {
            background: var(--card); border-radius: 25px; width: 100%; max-width: 380px;
            padding: 25px; border: 1px solid var(--glass);
        }

        .btn { padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #000; width: 100%; }
        .btn-ghost { background: transparent; color: var(--text-muted); width: 100%; margin-top: 10px; }

        .dot-loader { display: flex; gap: 4px; padding: 12px; align-self: flex-start; }
        .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { to { transform: translateY(-4px); opacity: 0.3; } }
        
        .mic-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--card); color: white; cursor: pointer; border: 1px solid var(--glass); }
        .mic-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<!-- Init Audio Overlay -->
<div id="audio-init">
    <i class="fas fa-robot" style="font-size: 4rem; color: var(--accent); margin-bottom: 20px;"></i>
    <h2 style="margin-bottom: 10px;">NEXHOME AI Siap</h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Klik tombol di bawah untuk mengaktifkan asisten suara.</p>
    <button class="btn btn-primary" style="width: 200px;" onclick="initSystem()">AKTIFKAN</button>
</div>

<div class="content-area" id="scroll-target">
    <!-- Tab AI -->
    <div id="tab-ai" class="tab-content active">
        <header style="margin-bottom: 20px;">
            <h1 style="font-size: 1.4rem; margin:0; color:var(--accent)">NEXHOME AI</h1>
            <small style="color:var(--text-muted)" id="ai-status">Asisten Online</small>
        </header>
        <div class="chat-container" id="chat-body"></div>
    </div>

    <!-- Tab Kontrol -->
    <div id="tab-control" class="tab-content">
        <header style="margin-bottom: 20px;">
            <h1 style="font-size: 1.4rem; margin:0;">Kontrol & Jadwal</h1>
        </header>
        <div class="device-grid" id="main-grid"></div>
    </div>
</div>

<div class="chat-input-container" id="ai-controls">
    <button class="mic-btn" id="btn-mic" onclick="startVoice()"><i class="fas fa-microphone"></i></button>
    <input type="text" id="user-input" class="chat-input" placeholder="Tanya status atau perintah..." onkeypress="handleKey(event)">
    <button class="mic-btn" style="background:var(--accent); color:#000" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('ai', this)">
        <i class="fas fa-comment-dots"></i><span>AI</span>
    </button>
    <button class="nav-item" onclick="switchTab('control', this)">
        <i class="fas fa-clock"></i><span>Kontrol</span>
    </button>
</nav>

<!-- Modal Jadwal -->
<div class="modal" id="sched-modal">
    <div class="modal-card">
        <h3 id="modal-title" style="margin-top:0">Jadwal Perangkat</h3>
        <div style="margin-bottom: 15px;">
            <label style="font-size:0.7rem; color:var(--text-muted)">GANTI NAMA</label>
            <input type="text" id="edit-name" class="chat-input" style="width:100%; margin-top:5px">
        </div>
        <div style="margin-bottom: 15px; border-top: 1px solid var(--glass); padding-top:15px">
            <label style="font-size:0.7rem; color:var(--text-muted)">TAMBAH JADWAL</label>
            <div style="display:flex; gap:10px; margin-top:5px">
                <input type="time" id="sched-time" class="chat-input" style="flex:2">
                <select id="sched-action" class="chat-input" style="flex:1; padding:10px">
                    <option value="1">ON</option>
                    <option value="0">OFF</option>
                </select>
            </div>
            <button class="btn btn-primary" style="margin-top:10px" onclick="addSchedule()">TAMBAH</button>
        </div>
        <div id="sched-list" style="max-height: 120px; overflow-y: auto; margin-bottom:15px"></div>
        <button class="btn btn-primary" onclick="saveSettings()">SIMPAN SEMUA</button>
        <button class="btn btn-ghost" onclick="closeModal()">TUTUP</button>
    </div>
</div>

<script>
    const TOKEN = "6CEmxirrKMGpqRbfXtjMC8s3UCJN4Y6Q";
    const API = "https://blynk.cloud/external/api";
    const apiKey = ""; 

    let pinStatus = new Map();
    let config = JSON.parse(localStorage.getItem('nex_ai_ultimate_v1')) || {
        names: ["Lampu Teras", "Lampu Ruang", "Kipas Angin", "Smart Socket", "Televisi", "Pompa Air", "Pagar Otomatis", "Sistem Alarm"],
        schedules: {} // pin: [{time, action, lastRun}]
    };
    let currentTemp = 0, currentHum = 0;
    let activePin = null;

    function initSystem() {
        document.getElementById('audio-init').style.display = 'none';
        renderGrid();
        sync();
        setInterval(sync, 4000);
        setInterval(checkSchedules, 30000); // Cek jadwal tiap 30 detik
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        el.classList.add('active');
        document.getElementById('ai-controls').style.display = (tabId === 'ai') ? 'flex' : 'none';
    }

    function renderGrid() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';
        for(let i=2; i<=9; i++) {
            const hasSched = (config.schedules[i] || []).length;
            const card = document.createElement('div');
            card.id = `card-v${i}`;
            card.className = 'device-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <i class="fas fa-power-off"></i>
                    <i class="fas fa-cog" style="cursor:pointer" onclick="openModal(${i})"></i>
                </div>
                <span class="device-name">${config.names[i-2]}</span>
                <span id="stat-v${i}" style="font-size:0.7rem; color:var(--text-muted)">MEMUAT...</span>
                ${hasSched ? `<div class="sched-tag"><i class="far fa-clock"></i> ${hasSched} Jadwal</div>` : ''}
                <button class="btn btn-primary" style="margin-top:10px; font-size:0.7rem; padding:8px" onclick="toggleDevice(${i})">TOGGLE</button>
            `;
            grid.appendChild(card);
        }
    }

    async function sync() {
        try {
            const [v0, v1] = await Promise.all([
                fetch(`${API}/get?token=${TOKEN}&V0`).then(r => r.text()),
                fetch(`${API}/get?token=${TOKEN}&V1`).then(r => r.text())
            ]);
            currentTemp = parseFloat(v0) || 0;
            currentHum = parseFloat(v1) || 0;
            for(let i=2; i<=9; i++) {
                const res = await fetch(`${API}/get?token=${TOKEN}&V${i}`).then(r => r.text());
                const val = Math.round(parseFloat(res)) === 1 ? 1 : 0;
                if(pinStatus.get(i) !== val) {
                    pinStatus.set(i, val);
                    updateUI(i, val);
                }
            }
        } catch(e) {}
    }

    function updateUI(pin, val) {
        const card = document.getElementById(`card-v${pin}`);
        const stat = document.getElementById(`stat-v${pin}`);
        if(!card) return;
        if(val === 1) { card.classList.add('active'); stat.innerText = "AKTIF"; }
        else { card.classList.remove('active'); stat.innerText = "MATI"; }
    }

    async function toggleDevice(pin, val = null) {
        const next = val !== null ? val : (pinStatus.get(pin) === 1 ? 0 : 1);
        updateUI(pin, next);
        pinStatus.set(pin, next);
        try { await fetch(`${API}/update?token=${TOKEN}&V${pin}=${next}`); } catch(e) {}
    }

    // --- AI LOGIC ---
    function handleKey(e) { if(e.key === 'Enter') askAI(); }

    async function askAI(q = null) {
        const input = document.getElementById('user-input');
        const query = q || input.value.trim();
        if(!query) return;
        if(!q) addBubble(query, 'user');
        input.value = '';

        const loader = addLoader();
        let on = [];
        for(let i=2; i<=9; i++) if(pinStatus.get(i) === 1) on.push(config.names[i-2]);

        const ctx = `Status: ${currentTemp}C, ${currentHum}%. ON: ${on.join(", ") || "Semua mati"}. Pin: ${config.names.map((n,i)=>`${n}=V${i+2}`).join(",")}`;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${ctx}\nUser: ${query}` }] }],
                    systemInstruction: { parts: [{ text: "Anda NEXHOME AI. Singkat, padat, ramah. Untuk kontrol kirim JSON: {\"action\":\"control\", \"pin\": nomor, \"value\": 0/1}. Selalu jawab dengan suara." }] }
                })
            });
            const data = await res.json();
            const text = data.candidates[0].content.parts[0].text;
            
            let cleanText = text;
            const match = text.match(/\{.*\}/s);
            if(match) {
                const act = JSON.parse(match[0]);
                if(act.action === "control") toggleDevice(act.pin, act.value);
                cleanText = text.replace(/\{.*\}/s, "").trim();
            }
            loader.remove();
            addBubble(cleanText, 'ai');
            speak(cleanText);
        } catch(e) { loader.remove(); addBubble("Maaf, ada gangguan.", 'ai'); }
    }

    function addBubble(t, s) {
        const b = document.getElementById('chat-body');
        const d = document.createElement('div');
        d.className = `bubble ${s}-bubble`; d.innerText = t;
        b.appendChild(d);
        document.getElementById('scroll-target').scrollTop = document.getElementById('scroll-target').scrollHeight;
    }

    function addLoader() {
        const b = document.getElementById('chat-body');
        const d = document.createElement('div'); d.className = 'dot-loader';
        d.innerHTML = '<div class="dot"></div><div class="dot"></div>';
        b.appendChild(d); return d;
    }

    // --- AUDIO & VOICE ---
    async function speak(t) {
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: t }] }],
                    generationConfig: { responseModalities:["AUDIO"], speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Kore"}}} }
                })
            });
            const data = await res.json();
            const pcm = data.candidates[0].content.parts[0].inlineData.data;
            playPCM(pcm);
        } catch(e) {}
    }

    function playPCM(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const wav = new ArrayBuffer(44 + bytes.length);
        const v = new DataView(wav);
        const s = (o, str) => { for(let i=0; i<str.length; i++) v.setUint8(o+i, str.charCodeAt(i)); };
        s(0, 'RIFF'); v.setUint32(4, 36+bytes.length, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true);
        v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 24000, true); v.setUint32(28, 48000, true);
        v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, bytes.length, true);
        new Uint8Array(wav, 44).set(bytes);
        new Audio(URL.createObjectURL(new Blob([wav], {type:'audio/wav'}))).play();
    }

    function startVoice() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) return;
        const r = new SR(); r.lang = 'id-ID';
        r.onstart = () => document.getElementById('btn-mic').classList.add('recording');
        r.onend = () => document.getElementById('btn-mic').classList.remove('recording');
        r.onresult = (e) => { const t = e.results[0][0].transcript; addBubble(t, 'user'); askAI(t); };
        r.start();
    }

    // --- SCHEDULING ---
    function openModal(pin) {
        activePin = pin;
        document.getElementById('modal-title').innerText = "Edit " + config.names[pin-2];
        document.getElementById('edit-name').value = config.names[pin-2];
        document.getElementById('sched-modal').style.display = 'flex';
        renderSchedList();
    }
    function closeModal() { document.getElementById('sched-modal').style.display = 'none'; }
    function renderSchedList() {
        const list = document.getElementById('sched-list');
        list.innerHTML = '';
        (config.schedules[activePin] || []).forEach((s, i) => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px; background:var(--glass); margin-top:5px; border-radius:8px; font-size:0.8rem">
                <span>${s.time} &rarr; <b>${s.action==1?'ON':'OFF'}</b></span>
                <i class="fas fa-trash" style="color:var(--danger); cursor:pointer" onclick="removeSched(${i})"></i>
            </div>`;
        });
    }
    function addSchedule() {
        const time = document.getElementById('sched-time').value;
        const action = document.getElementById('sched-action').value;
        if(!time) return;
        if(!config.schedules[activePin]) config.schedules[activePin] = [];
        config.schedules[activePin].push({ time, action, lastRun: '' });
        renderSchedList();
    }
    function removeSched(i) { config.schedules[activePin].splice(i, 1); renderSchedList(); }
    function saveSettings() {
        config.names[activePin-2] = document.getElementById('edit-name').value;
        localStorage.setItem('nex_ai_ultimate_v1', JSON.stringify(config));
        renderGrid(); closeModal();
    }
    function checkSchedules() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        const dateStr = now.toDateString();
        Object.keys(config.schedules).forEach(pin => {
            config.schedules[pin].forEach(s => {
                if(s.time === timeStr && s.lastRun !== dateStr) {
                    s.lastRun = dateStr;
                    toggleDevice(parseInt(pin), parseInt(s.action));
                    localStorage.setItem('nex_ai_ultimate_v1', JSON.stringify(config));
                }
            });
        });
    }
</script>
</body>
</html>
